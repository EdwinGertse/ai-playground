spring:
  application:
    name: ai-playground
  ai:
    openai:
      api-key: ${SPRING_AI_OPEN_AI_API_KEY}
      chat:
        options:
          model: 'gpt-4o-mini'
      moderation:
        options:
          model: omni-moderation-latest
    chat:
      client:
        enabled: true
#    vectorstore:
#      pgvector:
#        initialize-schema: true
  docker:
    compose:
      enabled: true
      file: docker-compose.yml

  datasource:
    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PWD}

app:
  number-of-highest-rated-films: 3

chat-memory:
  repo:
    max-messages: 50

logging:
  level:
    root: DEBUG
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
